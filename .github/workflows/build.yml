name: Build BrightIntosh

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref (branch / tag / sha) to build'
        required: false
        default: main
        type: string
      force:
        description: 'Build even if this upstream commit already has a release'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 9 * * *'   # daily at 09:17 UTC

permissions:
  contents: read   # build job overrides to write for publishing

concurrency:
  group: build-${{ github.event.inputs.ref || 'main' }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
      build: ${{ steps.r.outputs.build }}
    steps:
      - id: r
        env:
          REF: ${{ github.event.inputs.ref || 'main' }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/niklasr22/BrightIntosh/commits/${REF}" --jq .sha)
          SHORT=${SHA:0:7}
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Upstream ${REF} -> ${SHA}"
          # Build only if this upstream commit doesn't already have a release.
          if [ "${FORCE}" = "true" ] || ! gh release view "build-${SHORT}" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already released — skipping."
          fi

  # GitHub disables scheduled workflows after 60 days of repo inactivity;
  # hitting the "enable" endpoint resets that timer.
  # See: https://github.com/liskin/gh-workflow-keepalive
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${GH_REPO}/actions/workflows/build.yml/enable"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    permissions:
      contents: write   # for `gh release create` / `delete`
    steps:
      - uses: actions/checkout@v7
        with:
          repository: niklasr22/BrightIntosh
          ref: ${{ needs.check.outputs.sha }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (non-Store scheme = unrestricted)
        run: |
          xcodebuild \
            -project BrightIntosh.xcodeproj \
            -scheme BrightIntosh \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign and zip
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -type d -name BrightIntosh.app | head -n1)
          # Sign nested bundles before the outer app.
          find "$APP/Contents" \( -name '*.appex' -o -name '*.framework' \) -prune -print \
            | while read -r b; do codesign --force --sign - "$b"; done
          codesign --force --sign - "$APP"
          ditto -c -k --keepParent "$APP" BrightIntosh.zip

      - name: Publish release
        env:
          SHA: ${{ needs.check.outputs.sha }}
          SHORT: ${{ needs.check.outputs.short }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          NOTES="Auto-built from [niklasr22/BrightIntosh@${SHORT}](https://github.com/niklasr22/BrightIntosh/commit/${SHA}). Non-Store scheme, ad-hoc signed.

          **Install:** unzip, then \`xattr -cr /Applications/BrightIntosh.app\` to clear quarantine.

          Always-newest link: <https://github.com/${GH_REPO}/releases/latest/download/BrightIntosh.zip>"
          # One release per upstream commit; --latest holds the stable download
          # URL. The delete lets a forced re-run replace that commit's release.
          gh release delete "build-${SHORT}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "build-${SHORT}" BrightIntosh.zip \
            --title "Build ${DATE} — upstream ${SHORT}" \
            --notes "${NOTES}" --latest

      - name: Prune old releases (keep newest 10)
        run: |
          set -euo pipefail
          gh release list -L 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:][].tagName' \
            | while read -r t; do
                echo "Pruning ${t}"
                gh release delete "$t" --cleanup-tag --yes
              done
